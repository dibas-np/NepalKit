# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: true

reviews:
  profile: "chill"
  request_changes_workflow: false
  allow_author_approval: true
  high_level_summary: true
  review_status: true
  poem: false
  tools:
    swiftlint:
      enabled: true
  path_filters:
    - "!DerivedData/**"
    - "!.build/**"
  path_instructions:
    - path: "**/Info.plist"
      instructions: >
        NepalKit/Info.plist is hand-authored, not generated. Don't suggest
        INFOPLIST_KEY_* build settings or editing it with PlistBuddy, which
        strips its comments.
    - path: "**/appcast.xml"
      instructions: >
        Signed with Sparkle's EdDSA key over the exact bytes. Any edit, including
        whitespace, needs a re-sign.

tone_instructions: >
  Be direct and specific. Say what breaks and when. Don't manufacture concerns.
