# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# see - https://docs.coderabbit.ai/configure-coderabbit/

language: "en-US"

early_access: true

reviews:
  # Worth the walkthrough on a change of this size: this repository's convention
  # is that a change explains the reasoning it rejected, and the reasoning is
  # usually in the comments the walkthrough collapses.
  collapse_walkthrough: false
  poem: false
  high_level_summary: true
  review_status: true
  # A human merges. GOVERNANCE.md:17 makes merge decisions the maintainer's, so
  # CodeRabbit should never be the thing that blocks.
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: true

# The gates, so a review comment does not ask for something a gate already
# enforces, or miss something only a gate can see.
path_filters:
  - "!**/*.md"
  - "!plans/**"
  - "!docs/notes/**"
  - "!DerivedData/**"
  - "!.build/**"

# Guidance that is specific to this repository and is not inferable from the
# code. Each entry is a false positive this configuration exists to prevent.
instructions_for_reviewers:
  - "The macOS deployment floor is 26.6 and is written in three places that do
     not know about each other: every XCBuildConfiguration in project.pbxproj,
     DEPLOYMENT_TARGET in scripts/package-release.sh, and LSMinimumSystemVersion
     in the built product. They drifted once already - the app target built at
     26.6 while the project-level configs and the release script said 26.0, and
     the appcast verifier reported success because it compares the feed against
     the release script's declared value rather than against the build. If you
     see a change to any one of them, check all three agree."
  - "NepalKit/Info.plist is hand-authored and is NOT generated. The app target
     has GENERATE_INFOPLIST_FILE unset and INFOPLIST_FILE pointing at
     NepalKit/Info.plist; only the test target has the generator on. A source
     Info.plist therefore carries the unexpanded $(MACOSX_DEPLOYMENT_TARGET)
     token, which is why no script can read the floor out of it. Do not suggest
     generating it, and do not add INFOPLIST_KEY_* settings - Xcode honours only
     an allowlist of those names and drops unknown ones in silence."
  - "Sparkle is pinned to 2.9.6 (ADR-0012) and must not be upgraded as part of
     another change. SURequireSignedFeed and SUVerifyUpdateBeforeExtraction are
     one decision: Sparkle refuses to check for updates unless both are enabled,
     and setting the first alone ships an app that cannot update. A change to
     either key has to change both, and InfoPlistKeysTests asserts the pair."
  - "appcast.xml is signed with the project's EdDSA key. Editing it invalidates
     the signature, so any change to the feed must be followed by a re-sign, and
     the signature is written as a trailing <!-- sparkle-signatures: --> comment
     rather than as an attribute. verify-appcast.py exits non-zero on an
     unsigned feed and that is the intended state until a maintainer re-signs."
  - "scripts/check-all.sh is the single local entry point and now runs seven
     gates. The app-target build is deliberately first: neither test suite
     compiles the app, because scripts/apptests excludes NepalKitApp.swift and
     SparkleUpdateService.swift so the harness can link NepalKitCore only. Plan
     021 shipped a file the app could not compile and twenty-two plans passed
     every other gate, because none of them built anything."
  - "Comments in this codebase are load-bearing and unusually long, and they
     explain why an approach was rejected. That is deliberate house style, not
     noise: a comment that says only what the code does will be flagged as
     redundant here. Judge a comment on whether the reasoning is correct, not on
     whether the code beside it already says it."
  - "AGENTS.md is gitignored and exists only on the maintainer's machine;
     CODING_STANDARDS.md is the committed, authoritative copy of the house
     style. Do not suggest editing AGENTS.md and do not treat its absence from
     the repository as a missing file."
  - "SwiftLint reports pre-existing violations and is not a blocking gate;
     CONTRIBUTING.md records that. A new violation introduced by a change is
     worth flagging, the existing 9 are not."

# The two commands a reviewer reaches for most often, kept here so they do not
# have to be rediscovered.
#   ./scripts/check-all.sh        - every local gate, seven of them
#   verify-deployment-floor.py    - is the floor one number everywhere
