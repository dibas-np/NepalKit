# SonarQube Cloud analysis configuration.
#
# This project is analysed by SonarCloud's automatic analysis, which ignores
# `sonar-project.properties` outright and reads this file instead. Only a
# fixed list of settings is honoured here — sources, tests, their inclusions
# and exclusions, encoding, CPD exclusions, the Python version, and the C-family
# reporting standard — so per-rule and per-file exclusions cannot be configured
# from the repository at all. Read from the default branch, which means it also
# governs pull request analyses.

# The version these scripts actually run on, rather than the newest one Sonar
# would assume. Left unset, SonarPython analyses as compatible with 3.10
# through 3.14 and says so on every run — which is true, and useless, because
# it is indistinguishable from having no opinion at all.
#
# 3.10 is measured rather than guessed. Every script here runs on whichever
# `python3` the operator has, and on the maintainer's machine that interpreter
# is 3.10.1: all seven suites pass on it. Declaring it makes SonarPython reject
# 3.11-only syntax — possessive quantifiers, `match`, `tomllib` — in a script
# that a 3.10 interpreter would refuse to execute. That is not hypothetical: a
# possessive `\s*+` fix passed SonarCloud cleanly and only surfaced because it
# happened to be run against 3.10 before it was committed. Pinning the version
# turns "we got lucky" into "the analyser says so".
#
# Raise this when the floor genuinely moves, not when a new Python ships.
sonar.python.version=3.10

# `sonar.tests` is deliberately left unset, and the warning asking for it is
# answered here rather than left to be re-read on every analysis.
#
# SonarCloud's warning is that it found files resembling tests while no test
# scope is configured, so production rules were not run on them. That is already
# the wanted behaviour: `test_*.py` files are skipped by production rules, so
# the suites cannot report findings against the tooling they check. Declaring
# the scope explicitly would not change which rules run.
#
# It also cannot be declared correctly for this layout. `sonar.tests` accepts
# directories and individual file paths but no wildcards, and a directory named
# in both `sonar.sources` and `sonar.tests` fails the entire analysis with a
# source/test overlap error. Seven test files sit in `scripts/` alongside seven
# production scripts, so the only two options are:
#
#   sonar.tests=scripts              every one of those fourteen files becomes
#                                    test code, which would switch off the
#                                    security rules on verify-appcast.py and
#                                    update-changelog.py — the exact files whose
#                                    findings this repository spent PR #13
#                                    closing — and overlaps sources besides
#
#   sonar.tests=scripts/test_a.py,…  correct today, and rots silently: the next
#                                    scripts/test_*.py is simply absent from the
#                                    list, so it starts counting as production
#                                    code with nobody editing a list they have
#                                    to remember exists
#
# A hand-maintained list that must be amended every time a suite is added is a
# worse arrangement than the naming convention already doing the job correctly.
# `sonar.test.inclusions` is not an escape hatch: it accepts wildcards but only
# filters a test scope that already exists, and cannot create one.
#
# A `tests/` directory holding no production code would make this settable
# correctly, and it is not proposed, because there would be nothing left to win.
# The one thing test scope adds is coverage import: SonarQube Cloud does not
# compute coverage itself, and importing a third-party report is documented as
# available only to CI-based analysis, not to automatic analysis. Checked rather
# than assumed — asking this project for the `coverage` measure returns an empty
# list of measures, which is what a project whose analysis cannot carry coverage
# looks like.
#
# So moving the suites would silence this warning and change nothing else. Rule
# targeting, the other half of what `sonar.tests` does, is already correct: that
# is the convention described at the top of this comment, and it is why leaving
# this unset costs no coverage of the production scripts.
#
# If this project ever moves to CI-based analysis, coverage becomes available and
# this decision should be reopened with the layout question answered properly.