name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: every commit carries a DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for a Signed-off-by trailer on each commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          missing=0
          while read -r sha; do
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^[[:space:]]*Signed-off-by:[[:space:]]*.+$'; then
              subject=$(git log -1 --format='%s' "$sha")
              echo "::error file=.github/CONTRIBUTING.md::Missing 'Signed-off-by:' in $sha — $subject"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "${BASE}..${HEAD}" --not origin/main)
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "$missing commit(s) without a DCO certificate."
            echo "Add one without rewriting anything else:"
            echo "  git fetch origin $BASE_REF"
            echo "  git rebase --signoff origin/$BASE_REF && git push --force-with-lease"
            exit 1
          fi
          echo "Every commit carries a Signed-off-by line."
