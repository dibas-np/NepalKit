name: Data sources

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 2 * *"   # monthly; pinned sources are immutable, so this
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: shipped table matches its recorded provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The provenance parsers still parse
        run: |
          set -euo pipefail
          python3 scripts/test_dataset_parsers.py
      - name: The Patro reminder's own suite
        run: python3 scripts/test_check_patro_reminder.py
      - name: The changelog generator still fails loudly and rewrites nothing
        run: |
          set -euo pipefail
          python3 scripts/test_update_changelog.py
      - name: Compare the shipped table against the committed baseline
        run: |
          set -euo pipefail
          python3 scripts/verify-data-sources.py --baseline scripts/data-sources-baseline.json

  sparkle-pin-freshness:
    name: Sparkle pin is still current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Compare the pinned Sparkle version against the latest release
        run: |
          set -euo pipefail
          PINNED=$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("NepalKit.xcodeproj/project.pbxproj").read_text()
          # Sparkle's own block only, so another package's requirement is
          # never read as Sparkle's.
          block = re.search(
              r'/\* XCRemoteSwiftPackageReference "Sparkle" \*/ = \{'
              r'((?:(?!/\* (?:XCRemoteSwiftPackageReference|End )).)*)',
              text, re.S)
          kind = block and re.search(r'kind = (\w+);', block.group(1))
          if not kind:
              raise SystemExit("no Sparkle package requirement found in project.pbxproj")
          version = re.search(r'version = ([\d.]+);', block.group(1))
          if kind.group(1) != "exactVersion" or not version:
              raise SystemExit(
                  f"Sparkle is pinned as {kind.group(1)}, not exactVersion; "
                  "this check assumes an exact pin")
          print(version.group(1))
          PY
          )
          # Downloaded to a file, then read from it. Piping the response into an
          # interpreter hands that response the runner's credentials and its
          RESPONSE="$RUNNER_TEMP/sparkle-latest-release.json"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            https://api.github.com/repos/sparkle-project/Sparkle/releases/latest \
            --output "$RESPONSE"
          LATEST=$(python3 - "$RESPONSE" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as source:
                  payload = json.load(source)
          except (OSError, ValueError) as error:
              sys.exit(f"could not read the Sparkle release response: {error}")
          if not isinstance(payload, dict) or "tag_name" not in payload:
              sys.exit(f"the Sparkle release response carries no tag_name: {payload}")
          print(payload["tag_name"].lstrip("v"))
          PY
          )
          echo "pinned=$PINNED latest=$LATEST"
          if [ "$PINNED" != "$LATEST" ]; then
            echo "::notice::Sparkle $LATEST is available; the pin is $PINNED. Review its release notes before bumping."
            exit 1
          fi
          echo "Sparkle pin is current"

  patro-reminder:
    name: monthly Nepali Patro check is recorded
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The monthly check is not overdue
        run: python3 scripts/check-patro-reminder.py
