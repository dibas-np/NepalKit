# Compare the shipped calendar with its sole pinned askbuddie base.
# The baseline records NepalKit's corrections and provisional 2084 projection.
# A red run means the observed range, coverage or differences changed. Review
# and regenerate the baseline with the corresponding dataset/source decision.
# A green run does not establish official calendar attestation.
name: Data sources

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 2 * *"   # monthly; pinned sources are immutable, so this
                            # only catches drift in the shipped table or the script
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: shipped table matches its recorded provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The provenance parsers still parse
        run: |
          set -euo pipefail
          python3 scripts/test_dataset_parsers.py
      - name: The changelog generator still fails loudly and rewrites nothing
        run: |
          set -euo pipefail
          python3 scripts/test_update_changelog.py
      - name: Compare the shipped table against the committed baseline
        run: |
          set -euo pipefail
          python3 scripts/verify-data-sources.py --baseline scripts/data-sources-baseline.json

  sparkle-pin-freshness:
    name: Sparkle pin is still current (ADR-0012)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Compare the pinned Sparkle version against the latest release
        run: |
          set -euo pipefail
          # Read the pin from the project's own `requirement`, not from
          # Package.resolved. That file used to be the source here, and an
          # Xcode 27 build deletes it: `-resolvePackageDependencies` resolves
          # correctly and then relocates the lockfile out of
          # project.xcworkspace/xcshareddata/swiftpm/ entirely, leaving a
          # tracked-file deletion in the working tree. The build is unaffected,
          # because the pin that actually governs resolution is the exactVersion
          # requirement below - verified by resolving with the lockfile absent
          # and still getting 2.9.6 - but a check that reads a file the
          # toolchain deletes is a check waiting to fail for a reason that has
          # nothing to do with Sparkle.
          PINNED=$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("NepalKit.xcodeproj/project.pbxproj").read_text()
          block = re.search(
              r'XCRemoteSwiftPackageReference "Sparkle".*?'
              r'kind = (?P<kind>\w+);\s*version = (?P<version>[\d.]+);',
              text, re.S)
          if block is None:
              raise SystemExit("no Sparkle package requirement found in project.pbxproj")
          if block.group("kind") != "exactVersion":
              raise SystemExit(
                  f"Sparkle is pinned as {block.group('kind')}, not exactVersion; "
                  "ADR-0012 requires an exact pin and this check assumes one")
          print(block.group("version"))
          PY
          )
          LATEST=$(curl -sf https://api.github.com/repos/sparkle-project/Sparkle/releases/latest \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          echo "pinned=$PINNED latest=$LATEST"
          if [ "$PINNED" != "$LATEST" ]; then
            echo "::notice::Sparkle $LATEST is available; the pin is $PINNED. ADR-0012 owns the bump decision."
            exit 1
          fi
          echo "Sparkle pin is current"
