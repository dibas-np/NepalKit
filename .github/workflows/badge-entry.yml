# Keep the OpenSSF Best Practices answers honest.
#
# ## Why this exists
#
# `.bestpractices.json` is 191 answers to a badge entry, and it is only worth
# anything if a wrong one fails. `scripts/verify-bestpractices-json.py` checks
# that structure, and `scripts/test_verify_bestpractices_json.py` checks the
# checker — but until this workflow, no CI job ran either one. They were gates
# 11 and 12 of a sixteen-gate ladder that only existed when a human ran
# `./scripts/check-all.sh` locally.
#
# That is precisely the failure .github/CONTRIBUTING.md names: "a structural check that
# only runs when someone remembers to run it is not a gate." A gate nobody runs
# is a comment. This workflow is what makes that claim
# true rather than aspirational — the same reason dco.yml exists, for the same
# reason: a rule that nothing enforces has quietly stopped being a rule.
#
# ## Why these and not the rest of the ladder
#
# The badge scripts are pure Python over a committed JSON file. The other four
# suites here (appcast verifier, SwiftLint bootstrap, release product verifier,
# coverage parser) run on stubs and fixtures only: no toolchain, simulator,
# built product or macOS tool. Together they take a few seconds, cheap enough
# for every pull request.
#
# The two local-only gates are absent for stated reasons, and this comment is
# where those reasons live:
#
# * **LaunchServices unregistration** (gate 8) registers and unregisters real
#   app bundles in the session's LaunchServices database. It needs a macOS
#   session with a GUI login, which a CI runner does not have.
# * **Coverage floor** (gate 14) runs both Swift suites under `swift test` with
#   coverage instrumentation and reads the result with `xcrun llvm-cov`. It needs
#   the macOS toolchain and roughly six minutes from a cold build, which is
#   every CI run (locally the build is cached and it takes seconds). Running it here would make this
#   workflow the slowest one in the repository to protect a number that moves
#   slowly. It is enforced locally and the floor is committed, so a regression
#   is caught by whoever runs the ladder.
#
# Every other gate runs in CI, in the workflow that owns it:
# * this one: the pure-Python suites (gate 2's bootstrap suite, gates 9 to 13);
# * macos26-floor.yml: gate 1 as build-for-testing (app plus hosted test
#   bundle), the core, app and cask suites, and the deployment floor check;
# * data-sources.yml: the parser and changelog suites;
# * codeql.yml: SwiftLint;
# * the Watch job: gate 16.
# `check-all.sh` is a superset and is not invoked here on purpose: its first
# gate builds the app, so running it would duplicate the macOS build rather than
# add a check.
name: Badge entry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  badge-entry:
    name: badge entry is well-formed and self-consistent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The checker's own suite
        # First, so the checker is known to work before it is trusted to judge
        # anything. A validator that has silently stopped validating is worse
        # than no validator, because it reports green.
        run: python3 scripts/test_verify_bestpractices_json.py
      - name: The badge entry
        run: python3 scripts/verify-bestpractices-json.py
      - name: The appcast verifier's own suite
        # pages.yml runs this only when a feed is published; a change to the
        # verifier itself must be tested on the pull request that makes it.
        run: python3 scripts/test_verify_appcast.py
      - name: The SwiftLint bootstrap's own suite
        run: python3 scripts/test_swiftlint.py
      - name: The release product verifier's own suite
        # codesign is stubbed in this suite, so it needs no macOS tool.
        run: python3 scripts/test_verify_release_product.py
      - name: The coverage parser's own suite
        # Fixture text only; the xcrun llvm-cov call it parses is never made.
        run: python3 scripts/test_measure_coverage.py
      - name: The signing-key check's own suite
        # Throwaway keys only; it never sees the real signing key.
        run: python3 scripts/test_check_signing_key.py
