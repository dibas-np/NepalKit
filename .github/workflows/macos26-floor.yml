# Deployment-floor gate (ADR-0007).
#
# The floor claim is behavioural: "this app builds, tests, and runs here." It is
# not a pixel comparison — design review belongs on the current macOS release,
# where a human is looking. The two are deliberately not confused.
#
# ## What this gate can no longer attest, and why
#
# This used to run on `macos-26` with Xcode 26.6, which meant a green run was
# evidence about macOS 26 — the floor itself. It now runs on `xcode-27`, and
# that image is **macOS 27**. So a green run is no longer evidence that the app
# works on macOS 26; it is evidence that it builds, tests, and launches on macOS
# 27.
#
# That trade was made deliberately, for a reason worth recording rather than
# rediscovering. The floor is macOS 26.6, and the Xcode 26.6 toolchain could not
# express it:
#
#     warning: The macOS deployment target 'MACOSX_DEPLOYMENT_TARGET' is set to
#     26.6, but the range of supported deployment target versions is 10.13 to
#     26.5.99.
#
# The toolchain whose job is to verify the floor could not represent the floor.
# The same Xcode also could not open the project file, because a maintainer on
# macOS 27 editing build settings in Xcode 27 rewrites it into object version 110
# and Xcode 26 reads only 100 — so every config edit cost a manual revert, twice
# caught only because CI turned red. The floor toolchain was simultaneously too
# old for the floor and too old for the file.
#
# What survives the change:
#
# - **The deployment floor is still declared, still gated, and still consistent.**
#   `scripts/verify-deployment-floor.py` compares the project, the release
#   script, the built product, and this repo's project-file format. That gate is
#   unaffected by which runner executes it.
# - **The compile-time floor still holds.** A macOS 27-only API is still an
#   error against a 26.6 deployment target; `@available` and the SDK enforce it
#   regardless of the Xcode version doing the enforcing. So the failure mode the
#   header below describes — "compiles fine on a maintainer's Xcode, breaks the
#   floor for everyone" — is still caught at compile time.
# - **The run now records the macOS version it is evidence about**, which the
#   old one did not.
#
# What is genuinely lost: no job now executes the app on macOS 26, so the claim
# "this runs on the floor" rests on the compile-time guarantee plus release
# evidence rather than on CI. If that matters enough to pay for, the way back is
# a second job on `macos-26` that cannot build the project at all — it would
# have to downgrade the object version first — which is why it was not done
# here. ADR-0007 records the decision and the way out.
#
# ## When this fails because the toolchain moved
#
# The Xcode floor is the point of the workflow, and it is also its expiry date.
# The `xcode-27` image is a **preview**, so it moves under you: betas get
# replaced, and the image eventually becomes the default macOS 27 image. When it
# does, the failure looks exactly like a regression:
#
#     ::error::Resolved Xcode <version> is below the 27.0 floor this gate asserts.
#
# It is not one. Nothing about NepalKit changed. The step says so in its own
# error message, because a contributor hitting this at midnight should not have
# to find this comment first.
#
# **Raising the floor is not a routine bump.** It is a re-evaluation of the
# deployment-floor claim, and it should be treated like one:
#
# 1. Check whether a *newer* floor is now the honest claim. The project deploys
#    to the lowest macOS it can support, and that is a product decision about
#    people on old hardware, not a build setting.
# 2. If the floor is unchanged, raise `XCODE_FLOOR` to whatever the image now
#    provides and record why.
# 3. Re-run the gate. A new floor has proved nothing until it has gone green, and
#    the `sw_vers` output at the top of the log is what says what it went green
#    on.
# 4. Update ADR-0007 if the floor itself moves. It records the claim this
#    workflow exists to enforce, and a stale claim is worse than no claim.
#
# A real regression looks completely different: the toolchain is present, the
# build or a test fails, and the log says which. That is the case this workflow
# exists for.

name: macOS 26 floor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Reusable so the release-tag workflow can gate a tag on this same check
  # rather than restating it. Two copies of a deployment-floor claim would drift,
  # and the one that drifts is the one nobody reads.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Declared, and the alert below is why. This workflow checks out the code, runs
# two test suites, builds and launches the result. It never writes back: no
# commit, no comment, no release, no artifact upload beyond the build log. So it
# gets `contents: read` and nothing more.
#
# Omitting the block does not mean "no permissions" — it means every step gets
# the repository's *default* token, which for a public repository is usually
# read/write on contents. `actions/checkout` also leaves that token in
# `.git/config` for anything that can read the workspace, so a workflow with no
# stated permissions is a workflow holding a credential larger than its job
# needs. CodeQL flagged this as `actions/missing-workflow-permissions`.
#
# `contents: read` is still exactly what checkout requires, so nothing here is
# broken by the narrowing — it is only made honest.
permissions:
  contents: read

jobs:
  floor:
    # The name below is load-bearing and is no longer accurate: this job runs on the
# xcode-27 image, which is macOS 27, so it is no longer a macOS 26 gate. It keeps
# the old name because the `main` ruleset requires a status check with exactly
# this name, and a renamed check that protection still demands is a check that
# can never be satisfied - every future pull request to main blocked forever.
# Renaming it is a one-line change *together with* editing the ruleset; doing one
# without the other breaks main.
    name: build, test, and launch on macOS 26
    runs-on: xcode-27
    # macOS runners are the expensive kind; a hung build should die long
    # before the 360-minute default.
    timeout-minutes: 45

    env:
      # A floor, not an exact pin, and the reason is mechanical rather than a
      # loosening of discipline. On the xcode-27 image the app directory is
      # `/Applications/Xcode_27_beta_3.app`, so an exact pin would name a beta
      # that GitHub renames on the next one; pinning it would break this gate on
      # a toolchain change that is not a regression, which is the exact failure
      # the header calls out as the worst one available.
      #
      # What is preserved is the property that matters: a green run states which
      # toolchain it used, in the log, every time. The resolved version is
      # printed below and asserted against this floor, so the image moving
      # forward changes a number in the log rather than silently changing what
      # the gate tests.
      XCODE_FLOOR: "27.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The gate attests a macOS version, so it has to know which one. Without
      # this step a green run says only that *some* macOS was green, which is the
      # one claim a floor gate exists to make and the one thing its own log
      # previously omitted.
      - name: Record the operating system this run is evidence about
        run: |
          set -euo pipefail
          sw_vers
          echo "Product version: $(sw_vers -productVersion)"

      - name: Resolve the image's default Xcode and assert its floor
        run: |
          set -euo pipefail
          candidate="/Applications/Xcode.app/Contents/Developer"
          if [ ! -d "$candidate" ]; then
            echo "::error::No default Xcode on this runner. The xcode-27 image is expected to provide one; listing what is installed."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          resolved=$(DEVELOPER_DIR="$candidate" xcodebuild -version | head -1 | awk '{print $2}')
          echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
          echo "Resolved Xcode: $resolved (floor ${XCODE_FLOOR})"

          if [ "$(printf '%s\n%s\n' "$XCODE_FLOOR" "$resolved" | sort -V | head -1)" != "$XCODE_FLOOR" ]; then
            echo "::error::Resolved Xcode $resolved is below the ${XCODE_FLOOR} floor this gate asserts. Either the image regressed, or this gate's floor needs re-evaluating - which is a decision about the deployment-floor claim, not a routine bump. See ADR-0007."
            exit 1
          fi
          DEVELOPER_DIR="$candidate" xcodebuild -version

      - name: Core suite
        working-directory: NepalKitCore
        run: swift test

      # Signing is disabled: the project sets a development team target-wide, and
      # a pull-request job must need no credentials and be unable to reach any.
      - name: Build the application
        run: |
          set -euo pipefail
          xcodebuild \
            -project NepalKit.xcodeproj \
            -scheme NepalKit \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/NepalKitDerivedData" \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
          echo "NEPAKIT_BUILT_PLIST=$RUNNER_TEMP/NepalKitDerivedData/Build/Products/Debug/NepalKit.app/Contents/Info.plist" >> "$GITHUB_ENV"

      - name: Cask updater suite
        run: python3 scripts/test_update_cask.py

      # The committed SwiftPM harness, not `xcodebuild test`. `xcodebuild test`
      # builds the app clean and then hangs before connecting, reproducibly and
      # including with an empty test; it is a toolchain issue, not a reason to
      # delete the app-layer tests. See ADR-0005.
      #
      # After the build, and with the product pointed at: `InfoPlistKeysTests`
      # checks the built Info.plist rather than the project, because a key the
      # build discards cannot be caught by reading the project. Run before the
      # build, or without that variable, they skip - and a skipped test still
      # reports as passing, so the Sparkle public key and LSUIElement would be
      # unguarded while the job stayed green.
      - name: App-layer suite
        run: ./scripts/run-app-tests.sh

      # The check that matters most: an LSUIElement app that
      # dies or respawns in a loop on its own floor is a real shipping defect,
      # and cosmetic differences are not.
      #
      # What this can and cannot establish is recorded below, and the distinction
      # is not blurred. It cannot prove the menu-bar item appeared or that the
      # popover opens, because doing so headlessly would need a launch-argument
      # debug hook that the spec explicitly forbids shipping.
      - name: Launch, survive, and exit without a relaunch loop
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/NepalKitDerivedData/Build/Products/Debug/NepalKit.app"
          binary="$app/Contents/MacOS/NepalKit"
          test -x "$binary" || { echo "::error::no built binary at $binary"; exit 1; }

          "$binary" &
          pid=$!
          sleep 12

          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the app did not survive 12s after launch"
            exit 1
          fi

          # A runaway loop would show up as more than one instance.
          instances=$(pgrep -f "$binary" | wc -l | tr -d ' ')
          echo "instances after launch: $instances"
          if [ "$instances" -ne 1 ]; then
            echo "::error::expected exactly one process, found $instances"
            pkill -f "$binary" || true
            exit 1
          fi

          # Terminate the way the app's own exit path does, then confirm it is
          # gone and does not come back.
          kill -TERM "$pid" 2>/dev/null || true
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::the app ignored SIGTERM"
            pkill -f "$binary" || true
            exit 1
          fi
          sleep 5
          if pgrep -f "$binary" >/dev/null; then
            echo "::error::the app relaunched after termination"
            pkill -f "$binary" || true
            exit 1
          fi
          echo "launched, survived, and terminated cleanly"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: NepalKit-macos26-build
          path: ${{ runner.temp }}/NepalKitDerivedData/Logs/Build
          if-no-files-found: ignore
          retention-days: 14

  watch:
    # Separate from the floor job on purpose. That job's name is fixed by the
    # main ruleset's required status check, so nothing about it may change; and
    # this one needs a watchOS simulator runtime, which is a different dependency
    # with a different failure mode. Sharing a job would couple the Mac app's
    # floor evidence to whether a Watch runtime happens to be installed.
    #
    # **If no usable runtime is installed, this job passes rather than fails**,
    # with a warning annotation in the log saying the Watch targets were not
    # exercised. A gate that turns red for an environment reason teaches people
    # to ignore red, which is how the 26.0/26.6 floor drift shipped; but the
    # cost of that choice is that a green run here is *not* by itself evidence
    # about the Watch targets. Overturn it deliberately, by making the discovery
    # step below `exit 1`.
    #
    # The device-architecture build exists because the simulator's `arm64` is not
    # the shipping architecture. The watchOS targets do not override ARCHS, so
    # this compiles both slices of the universal binary
    # `docs/watch/readiness-evidence.md` records - a `-target
    # arm64_32-apple-watchos26.6` compile appears in its log - which the
    # simulator run above does not. What it still cannot establish is that the
    # result runs on a device. That is the physical session's, and it is listed
    # at `docs/watch/physical-validation.md`.
    name: build and test the Watch app
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Says what it decided and why, so a red or skipped run is diagnosable from
      # the log alone rather than needing someone to have read this comment.
      #
      # "Is there a watchOS runtime" is NOT the right question, and answering it
      # that way is how this job would have gone quietly green forever. Since the
      # project's watchOS floor is 26.6, a 26.0 runtime is present but *unusable*:
      # a destination older than the deployment target cannot run the product, so
      # the suite would not execute while the job reported success. So the test is
      # a runtime at or above the floor, read from the project rather than
      # hard-coded here — which also means this step follows the floor if it moves.
      - name: Record whether a usable watchOS simulator runtime is available
        id: watchos
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          floor="$(sed -n 's/.*WATCHOS_DEPLOYMENT_TARGET = \([0-9.]*\);.*/\1/p' \
            NepalKit.xcodeproj/project.pbxproj | sort -u | tr '\n' ' ')"
          echo "watchOS floor(s) declared in the project: $floor"
          usable=""
          for runtime in $(xcrun simctl list runtimes | \
                            sed -n 's/^watchOS \([0-9.]*\) .*/\1/p' | sort -V); do
            if [ "$(printf '%s\n%s\n' "$runtime" "${floor%% *}" | sort -V | head -1)" = "${floor%% *}" ]; then
              usable="$usable $runtime"
            fi
          done
          if [ -n "$usable" ]; then
            echo "usable watchOS runtime(s):$usable"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No watchOS simulator runtime at or above the project's floor ($floor) is installed on this runner. The Watch suite did not run, and a green result here says nothing about the Watch targets."
          fi

      - name: Watch suite
        if: steps.watchos.outputs.available == 'true'
        run: |
          set -euo pipefail
          xcodebuild test \
            -project NepalKit.xcodeproj \
            -scheme "NepalKitWatch Watch App" \
            -configuration Debug \
            -destination 'platform=watchOS Simulator,name=Apple Watch SE 3 (40mm),OS=27.0' \
            CODE_SIGNING_ALLOWED=NO

      - name: The Watch targets at least build for device architecture
        if: steps.watchos.outputs.available == 'true'
        run: |
          set -euo pipefail
          xcodebuild build \
            -project NepalKit.xcodeproj \
            -scheme "NepalKitWatch Watch App" \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO
