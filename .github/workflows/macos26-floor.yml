# macOS 26 deployment-floor gate (ADR-0007).
#
# The floor claim is behavioural: "this app builds, tests, and runs here." It is
# not a pixel comparison — design review belongs on the current macOS release,
# where a human is looking. The two are deliberately not confused.
#
# This workflow is the *implementation* of that gate. It has now run: see
# ticket 04. That is why it is kept rather than retired once. The claim it
# enforces is published in the README, and it rots silently - a commit reaching
# for a macOS 27-only API compiles fine on a maintainer's Xcode 27 and breaks the
# floor for everyone on macOS 26.
#
# ## When this fails because the toolchain was retired
#
# The pinned Xcode is the point of the workflow, and it is also its expiry date.
# GitHub removes old Xcode versions from the runner image, and when it does the
# failure looks exactly like a regression:
#
#     ::error::Xcode 26.6 is not installed on this runner.
#
# It is not one. Nothing about NepalKit changed. The step below says so in its own
# error message, because a contributor hitting this at midnight should not have
# to find this comment first.
#
# **Raising the pin is not a routine bump.** It is a re-evaluation of the
# deployment-floor claim, and it should be treated like one:
#
# 1. Check whether a *newer* floor is now the honest claim. The project deploys
#    to the lowest macOS it can support, and that is a product decision about
#    people on old hardware, not a build setting.
# 2. If the floor is unchanged, pick the oldest Xcode on the image that still
#    opens the project at object version 100, and record why that one.
# 3. Re-run the gate. A new pin has proved nothing until it has gone green on a
#    `macos-26` runner.
# 4. Update ADR-0007 if the floor itself moves. It records the claim this
#    workflow exists to enforce, and a stale claim is worse than no claim.
#
# A real regression looks completely different: the toolchain is present, the
# build or a test fails, and the log says which. That is the case this workflow
# exists for.

name: macOS 26 floor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Declared, and the alert below is why. This workflow checks out the code, runs
# two test suites, builds and launches the result. It never writes back: no
# commit, no comment, no release, no artifact upload beyond the build log. So it
# gets `contents: read` and nothing more.
#
# Omitting the block does not mean "no permissions" — it means every step gets
# the repository's *default* token, which for a public repository is usually
# read/write on contents. `actions/checkout` also leaves that token in
# `.git/config` for anything that can read the workspace, so a workflow with no
# stated permissions is a workflow holding a credential larger than its job
# needs. CodeQL flagged this as `actions/missing-workflow-permissions`.
#
# `contents: read` is still exactly what checkout requires, so nothing here is
# broken by the narrowing — it is only made honest.
permissions:
  contents: read

jobs:
  floor:
    name: build, test, and launch on macOS 26
    runs-on: macos-26
    # macOS runners are the expensive kind; a hung build should die long
    # before the 360-minute default.
    timeout-minutes: 45

    env:
      # Pinned explicitly. The runner image's default Xcode has already moved
      # 26.4.1 -> 26.5 -> 26.6 and will keep moving, so relying on it means this
      # gate silently starts testing a different toolchain than it claims to.
      XCODE_VERSION: "26.6"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Select an explicit Xcode, not the image default
        run: |
          set -euo pipefail
          candidate="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$candidate" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner. Almost certainly toolchain retirement rather than a regression - GitHub removes old Xcode versions from the image. Raising the pin is a re-evaluation of the deployment-floor claim, not a routine bump; see 'When this fails because the toolchain was retired' in this header."
            echo "Installed:"; ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
          echo "Using DEVELOPER_DIR=$candidate"
          xcodebuild -version

      - name: Core suite
        working-directory: NepalKitCore
        run: swift test

      # The committed SwiftPM harness, not `xcodebuild test`. `xcodebuild test`
      # builds the app clean and then hangs before connecting, reproducibly and
      # including with an empty test; it is a toolchain issue, not a reason to
      # delete the app-layer tests. See ADR-0005.
      - name: App-layer suite
        run: ./scripts/run-app-tests.sh

      # Signing is disabled: the project sets a development team target-wide, and
      # a pull-request job must need no credentials and be unable to reach any.
      - name: Build the application
        run: |
          set -euo pipefail
          xcodebuild \
            -project NepalKit.xcodeproj \
            -scheme NepalKit \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/NepalKitDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The check that matters most, per the ticket: an LSUIElement app that
      # dies or respawns in a loop on its own floor is a real shipping defect,
      # and cosmetic differences are not.
      #
      # What this can and cannot establish is recorded below, and the distinction
      # is not blurred. It cannot prove the menu-bar item appeared or that the
      # popover opens, because doing so headlessly would need a launch-argument
      # debug hook that the spec explicitly forbids shipping.
      - name: Launch, survive, and exit without a relaunch loop
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/NepalKitDerivedData/Build/Products/Debug/NepalKit.app"
          binary="$app/Contents/MacOS/NepalKit"
          test -x "$binary" || { echo "::error::no built binary at $binary"; exit 1; }

          "$binary" &
          pid=$!
          sleep 12

          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the app did not survive 12s after launch"
            exit 1
          fi

          # A runaway loop would show up as more than one instance.
          instances=$(pgrep -f "$binary" | wc -l | tr -d ' ')
          echo "instances after launch: $instances"
          if [ "$instances" -ne 1 ]; then
            echo "::error::expected exactly one process, found $instances"
            pkill -f "$binary" || true
            exit 1
          fi

          # Terminate the way the app's own exit path does, then confirm it is
          # gone and does not come back.
          kill -TERM "$pid" 2>/dev/null || true
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::the app ignored SIGTERM"
            pkill -f "$binary" || true
            exit 1
          fi
          sleep 5
          if pgrep -f "$binary" >/dev/null; then
            echo "::error::the app relaunched after termination"
            pkill -f "$binary" || true
            exit 1
          fi
          echo "launched, survived, and terminated cleanly"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: NepalKit-macos26-build
          path: ${{ runner.temp }}/NepalKitDerivedData/Logs/Build
          if-no-files-found: ignore
          retention-days: 14
