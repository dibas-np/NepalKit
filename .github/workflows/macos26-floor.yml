name: macOS 26 floor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  floor:
    name: build, test, and launch on macOS 26
    runs-on: xcode-27
    timeout-minutes: 45

    env:
      XCODE_FLOOR: "27.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Record the operating system this run is evidence about
        run: |
          set -euo pipefail
          sw_vers
          echo "Product version: $(sw_vers -productVersion)"

      - name: Resolve the image's default Xcode and assert its floor
        run: |
          set -euo pipefail
          candidate="/Applications/Xcode.app/Contents/Developer"
          if [ ! -d "$candidate" ]; then
            echo "::error::No default Xcode on this runner. The xcode-27 image is expected to provide one; listing what is installed."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          version_output="$(DEVELOPER_DIR="$candidate" xcodebuild -version)"
          resolved="$(printf '%s\n' "$version_output" | awk 'NR == 1 { print $2 }')"
          echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
          echo "Resolved Xcode: $resolved (floor ${XCODE_FLOOR})"

          if [ -z "$resolved" ]; then
            echo "::error::Could not read an Xcode version from ${candidate}. Output was:"
            printf '%s\n' "$version_output"
            exit 1
          fi

          lowest="$(printf '%s\n%s\n' "$XCODE_FLOOR" "$resolved" | sort -V | awk 'NR == 1 { print }')"
          if [ "$lowest" != "$XCODE_FLOOR" ]; then
            echo "::error::Resolved Xcode $resolved is below the ${XCODE_FLOOR} floor this gate asserts. Either the image regressed, or this gate's floor needs re-evaluating - which is a decision about the deployment-floor claim, not a routine bump."
            exit 1
          fi
          printf '%s\n' "$version_output"

      - name: Core suite
        working-directory: NepalKitCore
        run: swift test

      - name: Watch support suite
        working-directory: NepalKitWatchSupport
        run: swift test

      - name: Build the application and the hosted test bundle
        run: |
          set -euo pipefail
          xcodebuild \
            -project NepalKit.xcodeproj \
            -scheme NepalKit \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/NepalKitDerivedData" \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
          echo "NEPAKIT_BUILT_PLIST=$RUNNER_TEMP/NepalKitDerivedData/Build/Products/Debug/NepalKit.app/Contents/Info.plist" >> "$GITHUB_ENV"

      - name: The built product exists where the suites will look
        run: |
          set -euo pipefail
          test -f "$NEPAKIT_BUILT_PLIST" || { echo "::error::no Info.plist at $NEPAKIT_BUILT_PLIST; the plist tests would skip silently"; exit 1; }
          test -x "$RUNNER_TEMP/NepalKitDerivedData/Build/Products/Debug/NepalKit.app/Contents/MacOS/NepalKit"

      - name: Deployment floor self-tests and consistency
        run: |
          set -euo pipefail
          python3 scripts/test_verify_deployment_floor.py
          python3 scripts/verify-deployment-floor.py

      - name: Cask updater suite
        run: python3 scripts/test_update_cask.py

      - name: Package release script suite
        run: python3 scripts/test_release_core.py

      - name: App-layer suite
        run: ./scripts/run-app-tests.sh

      - name: Launch, survive, and exit without a relaunch loop
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/NepalKitDerivedData/Build/Products/Debug/NepalKit.app"
          binary="$app/Contents/MacOS/NepalKit"
          test -x "$binary" || { echo "::error::no built binary at $binary"; exit 1; }

          "$binary" &
          pid=$!
          sleep 12

          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the app did not survive 12s after launch"
            exit 1
          fi

          instances=$(pgrep -f "$binary" | wc -l | tr -d ' ')
          echo "instances after launch: $instances"
          if [ "$instances" -ne 1 ]; then
            echo "::error::expected exactly one process, found $instances"
            pkill -f "$binary" || true
            exit 1
          fi

          kill -TERM "$pid" 2>/dev/null || true
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::the app ignored SIGTERM"
            pkill -f "$binary" || true
            exit 1
          fi
          sleep 5
          if pgrep -f "$binary" >/dev/null; then
            echo "::error::the app relaunched after termination"
            pkill -f "$binary" || true
            exit 1
          fi
          echo "launched, survived, and terminated cleanly"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: NepalKit-macos26-build
          path: ${{ runner.temp }}/NepalKitDerivedData/Logs/Build
          if-no-files-found: ignore
          retention-days: 14

  watch:
    name: build and test the Watch app
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Record whether a usable watchOS simulator runtime is available
        id: watchos
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          floor="$(sed -n 's/.*WATCHOS_DEPLOYMENT_TARGET = \([0-9.]*\);.*/\1/p' \
            NepalKit.xcodeproj/project.pbxproj | sort -uV | tail -1)"
          echo "watchOS floor declared in the project: $floor"
          usable=""
          runtimes="$(xcrun simctl list runtimes --json | python3 -c '
          import json, sys
          for runtime in json.load(sys.stdin)["runtimes"]:
              if runtime.get("isAvailable") and runtime["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.watchOS-"):
                  print(runtime["version"], runtime["identifier"])
          ' | sort -V)"
          while read -r version identifier; do
            lowest="$(printf '%s\n%s\n' "$version" "$floor" | sort -V | awk 'NR == 1 { print }')"
            if [ -n "$version" ] && [ "$lowest" = "$floor" ]; then
              usable="$usable$version $identifier"$'\n'
            fi
          done <<< "$runtimes"
          if [ -n "$usable" ]; then
            selected="$(printf '%s' "$usable" | sort -V | tail -1)"
            version="${selected%% *}"
            identifier="${selected#* }"
            device="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"].get(sys.argv[1], [])
          available = sorted((device for device in devices if device.get("isAvailable")), key=lambda device: device["udid"])
          if not available:
              sys.exit("No available simulator device for selected watchOS runtime " + sys.argv[1])
          print(available[0]["udid"])
          ' "$identifier")"
            echo "Selected watchOS $version simulator: $device"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "runtime=$version" >> "$GITHUB_OUTPUT"
            echo "device=$device" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No watchOS simulator runtime at or above the project's floor ($floor) is installed on this runner. The Watch suite did not run; device compilation is checked separately."
          fi

      - name: Watch suite
        if: steps.watchos.outputs.available == 'true'
        env:
          DEVICE: ${{ steps.watchos.outputs.device }}
        run: |
          set -uo pipefail
          run_suite() {
            xcodebuild test \
              -project NepalKit.xcodeproj \
              -scheme "NepalKitWatch Watch App" \
              -configuration Debug \
              -destination "platform=watchOS Simulator,id=$DEVICE" \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$1"
          }
          run_suite "$RUNNER_TEMP/watch-1.log" && exit 0
          if ! grep -qE "Application has termination assertions|test runner hung before establishing connection" "$RUNNER_TEMP/watch-1.log"; then
            exit 1
          fi
          echo "::warning::The simulator did not start the Watch test host; resetting it and retrying once."
          xcrun simctl shutdown "$DEVICE" || true
          xcrun simctl erase "$DEVICE"
          run_suite "$RUNNER_TEMP/watch-2.log"

      - name: The Watch targets at least build for device architecture
        run: |
          set -euo pipefail
          xcodebuild build \
            -project NepalKit.xcodeproj \
            -scheme "NepalKitWatch Watch App" \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO
