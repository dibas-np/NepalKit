name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
  schedule:
    - cron: '23 15 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  XCODE_VERSION: "26.6"
  XCODE_READABLE_OBJECT_VERSION: "100"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-26') || 'ubuntu-latest' }}
    timeout-minutes: 45
    # Analysis builds pull-request code, so it runs read-only; only the upload job,
    # which runs no repository code, can write code-scanning results.
    permissions:
      contents: read
      security-events: read
      packages: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: swift
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Select the pinned Xcode explicitly
        if: matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          candidate="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$candidate" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner; GitHub has likely removed it from the image."
            echo "Installed:"; ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
          echo "Using DEVELOPER_DIR=$candidate"
          xcodebuild -version

      - name: SwiftLint
        if: matrix.language == 'swift'
        run: ./scripts/swiftlint.sh lint --strict

      - name: Make the project readable by the pinned Xcode
        if: matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          project=NepalKit.xcodeproj/project.pbxproj
          current=$(sed -n 's/^\tobjectVersion = \([0-9]*\);/\1/p' "$project")
          if [ -z "$current" ]; then
            echo "::error::no objectVersion in $project; refusing to guess at the format"
            exit 1
          fi
          echo "object version in the checkout: $current (Xcode ${XCODE_VERSION} reads up to ${XCODE_READABLE_OBJECT_VERSION})"
          if [ "$current" -gt "$XCODE_READABLE_OBJECT_VERSION" ]; then
            sed -i '' "s/objectVersion = $current;/objectVersion = ${XCODE_READABLE_OBJECT_VERSION};/" "$project"
            echo "downgraded to ${XCODE_READABLE_OBJECT_VERSION} for this job only; runner-local, never pushed"
            echo "  now: $(grep -m1 objectVersion "$project")"
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the app (traced)
        if: matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project NepalKit.xcodeproj \
            -scheme NepalKit \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: sarif-results

      - name: Keep the results for the upload job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          retention-days: 1

  upload:
    name: Upload CodeQL results
    needs: analyze
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: codeql-sarif-*
          path: sarif-results
          merge-multiple: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: sarif-results
