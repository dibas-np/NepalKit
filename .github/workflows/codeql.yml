# CodeQL analysis, with explicit build steps.
#
# # For most projects, this workflow file will not need changing.
# # It differs from GitHub's generated template in four places, each because the
# # template's version does not work for NepalKit.
#
# 1. `build-mode: manual` for Swift, not `autobuild`.
#    GitHub's *default* code-scanning setup is a server-side workflow with no
#    file in this repository, so its build steps cannot be changed. Its Swift job
#    fails on the `macos-26` runner:
#
#        [ERROR] Spawned process exited abnormally (code 139;
#                tried to run: [.../codeql/swift/tools/autobuild.sh])
#        ##[error] We were unable to automatically build your code.
#                   Please replace the call to the autobuild action with your
#                   custom build steps.
#
#    139 is 128 + 11: a segmentation fault inside CodeQL's own `autobuild.sh`,
#    before any project source was compiled. The `python` and `actions` jobs of
#    that same run succeeded, which is what identifies it as a tool-and-runner
#    problem rather than a problem with this code. Committing the template
#    unchanged would reproduce it exactly.
#
# 2. `runs-on: macos-26` for Swift, not `macos-latest`.
#    The deployment floor is macOS 26 (ADR-0007). Analysing on a later release
#    would say nothing about whether the floor claim holds, and `macos-latest`
#    moves under the workflow without anyone editing it. Python and Actions
#    still run on ubuntu, which is cheaper and faster for interpreted code.
#
# 3. An explicit Xcode is selected, not the runner image default.
#    The image's default has already moved 26.4.1 -> 26.5 -> 26.6 and will keep
#    moving, so a security analysis that silently changes toolchain is not the
#    same analysis.
#
# ## Why this did not move to xcode-27 with macos26-floor.yml
#
# The floor gate moved to `xcode-27` because it had to: its Xcode could not
# express a 26.6 deployment target (SDK ceiling 26.5.99) and could not open the
# project. Those are properties of *building the app*, so they forced the move.
#
# This workflow was moved too, on the reasoning that the two must not drift. That
# reasoning was wrong, and the evidence is unambiguous:
#
#     posix_spawn error: Bad CPU type in executable (86),
#     ["/usr/bin/sandbox-exec", ..., "nepalkitcore-manifest", ...]
#     xcodebuild: error: Could not resolve package dependencies
#
# SwiftPM fails evaluating NepalKitCore's manifest on that image. It is not the
# code: the Swift source is byte-identical to the last run of this workflow that
# passed, and that run was on `macos-26`. `swift test` in the same package, on
# the same image, untraced, succeeds - the failure needs CodeQL's build tracer.
# Nothing about it is reported as a known issue on the image.
#
# Losing this leg is not an option - it is the only security analysis of the 73
# Swift files - so this job stays on `macos-26` and downgrades the project format
# in its own checkout to get past the one incompatibility that motivated the
# move. macos26-floor.yml therefore runs on macOS 27 and this runs on macOS 26.
# That divergence is intended and is why the "must not drift" claim above is
# limited to the Xcode pin rather than the runner.
#
# 4. NepalKitCore is built with its tests, separately.
#    The app scheme does not compile the test target, so a single `xcodebuild`
#    would leave roughly half the Swift source unextracted — and the analysis
#    would silently cover less than it appears to.
#
# Requires code scanning to be set to "Set up via workflows" rather than
# "Default setup" in Settings -> Code security. While "Default setup" is
# selected, GitHub runs its own workflow and this one is ignored.
#
# ## When this fails because the toolchain was retired
#
# The pinned Xcode is the point of the workflow, and it is also its expiry date.
# GitHub removes old Xcode versions from the runner image, and when it does the
# failure looks exactly like a regression:
#
#     ::error::Xcode 26.6 is not installed on this runner.
#
# It is not one. Nothing about NepalKit changed. The step says so in its own
# error message, because a contributor hitting this at midnight should not have
# to find this comment first.
#
# **Raising the pin is not a routine bump.** It is a re-evaluation of the
# deployment-floor claim, and it should be treated like one:
#
# 1. Check whether a *newer* floor is now the honest claim. The project deploys
#    to the lowest macOS it can support, and that is a product decision about
#    people on old hardware, not a build setting.
# 2. If the floor is unchanged, pick the oldest Xcode on the image that still
#    opens the project at object version 100, and record why that one.
# 3. Re-run the gate. A new pin has proved nothing until it has gone green on a
#    `macos-26` runner.
# 4. Update ADR-0007 if the floor itself moves. It records the claim this
#    workflow exists to enforce, and a stale claim is worse than no claim.
#
# A real regression looks completely different: the toolchain is present, the
# build or a test fails, and the log says which. That is the case this workflow
# exists for.

name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly, so a newly published advisory is noticed on code that has not
    # changed. A quarterly cron would leave a window open for months.
    - cron: '23 15 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

env:
  # Swift is analysed with the floor toolchain on `macos-26`, pinning that Xcode
  # exactly. macos26-floor.yml moved to `xcode-27` and this deliberately did not
  # follow; the header records why, and it is not a reason to re-litigate here.
  #
  # An exact pin is correct here and was wrong there. On the macos-26 image the
  # Xcode directory is named for its version (`Xcode_26.6.app`), so naming it
  # exactly is stable, and its retirement produces a clear message rather than a
  # silent toolchain change.
  XCODE_VERSION: "26.6"
  # The highest object version that Xcode 26 can open. The repository is 110,
  # because a maintainer's Xcode 27 rewrites the project whenever it is opened,
  # and Xcode 26 cannot read a 110 project at all - see the header.
  XCODE_READABLE_OBJECT_VERSION: "100"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Swift on the deployment floor; the interpreted languages on ubuntu, which
    # is quicker and cheaper and does not need a Mac.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-26') || 'ubuntu-latest' }}
    # The swift leg runs two traced builds on a macOS runner; bound the hang
    # case well under the 360-minute default.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: swift
            build-mode: manual
        # CodeQL supports the following values for 'language': 'actions',
        # 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript',
        # 'python', 'ruby', 'rust', 'swift'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Any setup has to happen before `init`, because CodeQL traces the build
      # commands that follow it.
      # Any setup has to happen before `init`, because CodeQL traces the build
      # commands that follow it.
      - name: Select the pinned Xcode explicitly
        if: matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          candidate="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$candidate" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner. Almost certainly toolchain retirement rather than a regression - GitHub removes old Xcode versions from the image. Raising the pin is a re-evaluation of the analysis's own claim, not a routine bump; macos26-floor.yml's header carries the policy, and this pin is chosen so the two do not drift."
            echo "Installed:"; ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
          echo "Using DEVELOPER_DIR=$candidate"
          xcodebuild -version

      - name: SwiftLint
        if: matrix.language == 'swift'
        run: ./scripts/swiftlint.sh lint --strict

      # Xcode 26 cannot open an object-version-110 project, and this repository
      # is 110 because a maintainer's Xcode 27 rewrites it whenever the project is
      # opened. So this job downgrades the format before building, in the runner's
      # own checkout, and never pushes it. a406c7e established that no build
      # setting differs between the two formats for this project - the rewrite is
      # sectional - so the downgrade costs nothing but the version line.
      #
      # The assertion is the point. Silently accepting whatever the file happens
      # to say would make this job's coverage depend on whoever last opened the
      # project in Xcode, which is the dependency that made the floor gate
      # unrunnable in the first place.
      - name: Make the project readable by the pinned Xcode
        if: matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          project=NepalKit.xcodeproj/project.pbxproj
          current=$(sed -n 's/^\tobjectVersion = \([0-9]*\);/\1/p' "$project")
          if [ -z "$current" ]; then
            echo "::error::no objectVersion in $project; refusing to guess at the format"
            exit 1
          fi
          echo "object version in the checkout: $current (Xcode ${XCODE_VERSION} reads up to ${XCODE_READABLE_OBJECT_VERSION})"
          if [ "$current" -gt "$XCODE_READABLE_OBJECT_VERSION" ]; then
            sed -i '' "s/objectVersion = $current;/objectVersion = ${XCODE_READABLE_OBJECT_VERSION};/" "$project"
            echo "downgraded to ${XCODE_READABLE_OBJECT_VERSION} for this job only; runner-local, never pushed"
            echo "  now: $(grep -m1 objectVersion "$project")"
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the app (traced)
        if: matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          # Debug, not Release: the extractor needs to see the code compiled, and
          # Release adds signing and optimisation — both only failure modes. The
          # release artifact is signed and notarized by scripts/package-release.sh
          # on a machine holding the credentials, not in a pull request.
          #
          # No output formatter and no `|| true`. A pipe through a tool the
          # runner may not have would fail the step, and swallowing that would
          # also swallow a genuine compile error, leaving a security gate
          # reporting success on code that was never built.
          xcodebuild build \
            -project NepalKit.xcodeproj \
            -scheme NepalKit \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build the core and its tests (traced)
        if: matrix.language == 'swift'
        shell: bash
        # Not redundant with the step above: the app scheme does not compile
        # NepalKitCore's test target, and those tests are where the calendar
        # conversion lives.
        run: |
          set -euo pipefail
          cd NepalKitCore
          # `--force-resolved-versions`, and there is no Package.resolved to
          # commit next to it: NepalKitCore declares no package dependencies, so
          # resolution has nothing to resolve and `swift package resolve` writes
          # no file here (checked, not assumed). The flag is what keeps that a
          # property of the build rather than a coincidence of today - the day a
          # dependency is added, this step fails instead of quietly resolving
          # whatever is newest in the declared range, and the answer is to commit
          # the Package.resolved it asks for.
          #
          # Deliberately not added to macos26-floor.yml or check-all.sh, which
          # build the same manifest: there the flag would have nothing to
          # enforce, and macos26-floor's job is the floor claim, not this one.
          swift build --build-tests --force-resolved-versions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
