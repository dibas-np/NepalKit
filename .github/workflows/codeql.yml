# CodeQL analysis, with explicit build steps.
#
# # For most projects, this workflow file will not need changing.
# # It differs from GitHub's generated template in four places, each because the
# # template's version does not work for NepalKit.
#
# 1. `build-mode: manual` for Swift, not `autobuild`.
#    GitHub's *default* code-scanning setup is a server-side workflow with no
#    file in this repository, so its build steps cannot be changed. Its Swift job
#    fails on the `macos-26` runner:
#
#        [ERROR] Spawned process exited abnormally (code 139;
#                tried to run: [.../codeql/swift/tools/autobuild.sh])
#        ##[error] We were unable to automatically build your code.
#                   Please replace the call to the autobuild action with your
#                   custom build steps.
#
#    139 is 128 + 11: a segmentation fault inside CodeQL's own `autobuild.sh`,
#    before any project source was compiled. The `python` and `actions` jobs of
#    that same run succeeded, which is what identifies it as a tool-and-runner
#    problem rather than a problem with this code. Committing the template
#    unchanged would reproduce it exactly.
#
# 2. `runs-on: xcode-27` for Swift, not `macos-latest`.
#    This was `macos-26`, chosen so the analysis would say something about the
#    deployment floor. It could not stay there: a maintainer on macOS 27 editing
#    build settings in Xcode 27 rewrites the project into object version 110, and
#    Xcode 26 cannot open that at all, so the Swift leg would fail with "Unable
#    to read project" before analysing a line. macos26-floor.yml moved for the
#    same reason and in the same commit; the two must not drift. Python and
#    Actions still run on ubuntu, which is cheaper and faster for interpreted code.
#
# 3. The image's default Xcode is resolved and its version asserted against a
#    floor, rather than an exact version being named. Same reasoning as
#    `.github/workflows/macos26-floor.yml`: the image's default moves under the
#    workflow, and on the preview image the directory is named for a beta that
#    gets replaced. A security analysis that silently changes toolchain is not
#    the same analysis, so the resolved version is printed and asserted.
#
# 4. NepalKitCore is built with its tests, separately.
#    The app scheme does not compile the test target, so a single `xcodebuild`
#    would leave roughly half the Swift source unextracted — and the analysis
#    would silently cover less than it appears to.
#
# Requires code scanning to be set to "Set up via workflows" rather than
# "Default setup" in Settings -> Code security. While "Default setup" is
# selected, GitHub runs its own workflow and this one is ignored.
#
# ## When this fails because the toolchain moved
#
# The Xcode floor is the point of the workflow, and it is also its expiry date.
# The `xcode-27` image is a preview, so it moves under you. When it does the
# failure looks exactly like a regression:
#
#     ::error::Resolved Xcode <version> is below the 27.0 floor.
#
# It is not one. Nothing about NepalKit changed. The step says so in its own
# error message, because a contributor hitting this at midnight should not have
# to find this comment first.
#
# **Raising the pin is not a routine bump.** It is a re-evaluation of the
# deployment-floor claim, and it should be treated like one:
#
# 1. Check whether a *newer* floor is now the honest claim. The project deploys
#    to the lowest macOS it can support, and that is a product decision about
#    people on old hardware, not a build setting.
# 2. If the floor is unchanged, pick the oldest Xcode on the image that still
#    opens the project at object version 100, and record why that one.
# 3. Re-run the gate. A new pin has proved nothing until it has gone green on a
#    `macos-26` runner.
# 4. Update ADR-0007 if the floor itself moves. It records the claim this
#    workflow exists to enforce, and a stale claim is worse than no claim.
#
# A real regression looks completely different: the toolchain is present, the
# build or a test fails, and the log says which. That is the case this workflow
# exists for.

name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly, so a newly published advisory is noticed on code that has not
    # changed. A quarterly cron would leave a window open for months.
    - cron: '23 15 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

env:
  # A floor rather than an exact pin, matching macos26-floor.yml, and for the
  # same mechanical reason: on the `xcode-27` image the app directory is
  # `Xcode_27_beta_3.app`, so naming a beta exactly would break on the next one.
  # The resolved version is asserted against this floor and printed, so the
  # toolchain a given analysis ran on is always in the log.
  #
  # The two workflows must not drift; macos26-floor.yml's header carries the
  # policy and the reasoning for moving off `macos-26` at all. They moved
  # together because a maintainer's Xcode 27 rewrites the project into object
  # version 110, and Xcode 26 cannot open that — so a Swift analysis pinned to
  # 26.6 could not build the code it was meant to analyse.
  XCODE_FLOOR: "27.0"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Swift on the deployment floor; the interpreted languages on ubuntu, which
    # is quicker and cheaper and does not need a Mac.
    runs-on: ${{ (matrix.language == 'swift' && 'xcode-27') || 'ubuntu-latest' }}
    # The swift leg runs two traced builds on a macOS runner; bound the hang
    # case well under the 360-minute default.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: swift
            build-mode: manual
        # CodeQL supports the following values for 'language': 'actions',
        # 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript',
        # 'python', 'ruby', 'rust', 'swift'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Any setup has to happen before `init`, because CodeQL traces the build
      # commands that follow it.
      - name: Resolve the image's default Xcode and assert its floor
        if: matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          candidate="/Applications/Xcode.app/Contents/Developer"
          if [ ! -d "$candidate" ]; then
            echo "::error::No default Xcode on this runner. The xcode-27 image is expected to provide one; listing what is installed."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          resolved=$(DEVELOPER_DIR="$candidate" xcodebuild -version | head -1 | awk '{print $2}')
          echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
          echo "Resolved Xcode: $resolved (floor ${XCODE_FLOOR})"

          if [ "$(printf '%s\n%s\n' "$XCODE_FLOOR" "$resolved" | sort -V | head -1)" != "$XCODE_FLOOR" ]; then
            echo "::error::Resolved Xcode $resolved is below the ${XCODE_FLOOR} floor. Move this floor in step with macos26-floor.yml; that workflow's header has the policy, and the two must not drift."
            exit 1
          fi
          DEVELOPER_DIR="$candidate" xcodebuild -version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the app (traced)
        if: matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          # Debug, not Release: the extractor needs to see the code compiled, and
          # Release adds signing and optimisation — both only failure modes. The
          # release artifact is signed and notarized by scripts/package-release.sh
          # on a machine holding the credentials, not in a pull request.
          #
          # No output formatter and no `|| true`. A pipe through a tool the
          # runner may not have would fail the step, and swallowing that would
          # also swallow a genuine compile error, leaving a security gate
          # reporting success on code that was never built.
          xcodebuild build \
            -project NepalKit.xcodeproj \
            -scheme NepalKit \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build the core and its tests (traced)
        if: matrix.language == 'swift'
        shell: bash
        # Not redundant with the step above: the app scheme does not compile
        # NepalKitCore's test target, and those tests are where the calendar
        # conversion lives.
        run: |
          set -euo pipefail
          cd NepalKitCore
          swift build --build-tests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
