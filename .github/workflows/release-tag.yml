name: release tag

on:
  push:
    tags: ['v[0-9]*']

concurrency:
  group: release-signing
  cancel-in-progress: false

permissions: {}

env:
  RELEASE_OWNER: dibas-np

jobs:
  preflight:
    name: verify trusted release ref
    if: >-
      github.repository == 'dibas-np/NepalKit' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.actor == 'dibas-np' &&
      github.triggering_actor == 'dibas-np'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      version: ${{ steps.source.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT_SHA="$(git rev-parse 'HEAD^{commit}')"

          VERIFIED="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" \
            --jq '.commit.verification.verified')"
          if [[ "$VERIFIED" != "true" ]]; then
            echo "Release commit is not verified by GitHub" >&2
            echo "Register the signing key, or the first tag will fail here:" >&2
            echo "  gh auth refresh -h github.com -s admin:ssh_signing_key" >&2
            echo "  gh ssh-key add ~/.ssh/nepalkit_signing.pub --type signing --title 'NepalKit commit signing'" >&2
            exit 1
          fi

          RELATION="$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT_SHA...main" \
            --jq '.status + ":" + .merge_base_commit.sha')"
          if [[ "$RELATION" != "identical:$COMMIT_SHA" && "$RELATION" != "ahead:$COMMIT_SHA" ]]; then
            echo "Release tag does not point to a commit on main ($RELATION)" >&2
            exit 1
          fi

          app_setting() {
            python3 - "$1" <<'PY'
          import re
          import sys

          setting = sys.argv[1]
          text = open("NepalKit.xcodeproj/project.pbxproj").read()
          APP = "NepalKit"

          # A pbxproj object block opens at exactly two tabs. The native target
          # also names its configuration list one tab deeper and ending in a
          # semicolon, so the two-tab brace form matches only the list block
          # itself, never the reference to it.
          list_m = re.search(
              r'\n\t\t([A-F0-9]{24}) /\* Build configuration list for PBXNativeTarget "%s" \*/ = \{' % APP,
              text)
          if not list_m:
              sys.exit("no build configuration list for target %s" % APP)
          list_end = text.find("\n\t\t};", list_m.start())
          if list_end < 0:
              sys.exit("unterminated configuration list block %s" % list_m.group(1))

          configs = re.findall(
              r'([A-F0-9]{24}) /\* ((?:Debug|Release) configuration for PBXNativeTarget "%s") \*/' % APP,
              text[list_m.start():list_end])
          if sorted(name.split()[0] for _, name in configs) != ["Debug", "Release"]:
              sys.exit("expected exactly a Debug and a Release configuration for %s, found: %s"
                       % (APP, ", ".join(name.split()[0] for _, name in configs) or "none"))

          values = []
          for config_id, config_name in configs:
              block = re.search(
                  r'\n\t\t%s /\* %s \*/ = \{(.*?)\n\t\t\};' % (config_id, re.escape(config_name)),
                  text, re.S)
              if not block:
                  sys.exit("unreadable build configuration block %s" % config_id)
              value = re.search(r'^\s*%s = ([^;]+);' % setting, block.group(1), re.M)
              if not value:
                  sys.exit("%s is missing from %s's %s configuration"
                           % (setting, APP, config_name.split()[0]))
              values.append(value.group(1).strip())

          for value in sorted(set(values)):
              print(value)
          PY
          }
          APP_VERSION="$(app_setting MARKETING_VERSION)"
          if [[ -z "$APP_VERSION" || "$APP_VERSION" == *$'\n'* ]]; then
            echo "Expected exactly one MARKETING_VERSION in the NepalKit target, found: ${APP_VERSION:-none}" >&2
            exit 1
          fi
          if [[ "$APP_VERSION" != "$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match the app's version $APP_VERSION" >&2
            echo "MARKETING_VERSION is the source; the tag must follow it." >&2
            exit 1
          fi

          BUILD_NUMBER="$(app_setting CURRENT_PROJECT_VERSION)"
          if [[ -z "$BUILD_NUMBER" || "$BUILD_NUMBER" == *$'\n'* ]]; then
            echo "Expected exactly one CURRENT_PROJECT_VERSION in the NepalKit target, found: ${BUILD_NUMBER:-none}" >&2
            exit 1
          fi

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  floor:
    name: gate the tagged commit on macOS 26
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/macos26-floor.yml

  bump-tap:
    name: bump the Homebrew cask
    needs: [preflight, floor]
    if: >-
      github.repository == 'dibas-np/NepalKit' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.actor == 'dibas-np' &&
      github.triggering_actor == 'dibas-np'
    runs-on: macos-26
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Reverify the release ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse 'HEAD^{commit}')"
          REMOTE_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$REMOTE_COMMIT" != "$COMMIT_SHA" ]]; then
            echo "Release tag moved after the preflight: $COMMIT_SHA -> $REMOTE_COMMIT" >&2
            exit 1
          fi
          RELATION="$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT_SHA...main" \
            --jq '.status + ":" + .merge_base_commit.sha')"
          if [[ "$RELATION" != "identical:$COMMIT_SHA" && "$RELATION" != "ahead:$COMMIT_SHA" ]]; then
            echo "Release tag no longer points to a commit on main" >&2
            exit 1
          fi

      - name: Configure the tap deploy key
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is empty in the release environment"
            exit 1
          fi
          TAP_SSH="$RUNNER_TEMP/tap-ssh"
          install -m 700 -d "$TAP_SSH"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$TAP_SSH/key"
          chmod 600 "$TAP_SSH/key"

          KEYS="$(gh api meta --jq '.ssh_keys[] | "github.com " + .')"
          if [ -z "$KEYS" ]; then
            echo "::error::GitHub's meta API returned no SSH host keys" >&2
            exit 1
          fi
          printf '%s\n' "$KEYS" > "$TAP_SSH/known_hosts"

          # Paths quoted, here and in core.sshCommand below, so a RUNNER_TEMP
          # with a space in it (a self-hosted runner) still names one file.
          cat > "$TAP_SSH/config" <<CONFIG
          Host github-tap
            HostName github.com
            User git
            IdentityFile "$TAP_SSH/key"
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile "$TAP_SSH/known_hosts"
            GlobalKnownHostsFile /dev/null
          CONFIG
          chmod 600 "$TAP_SSH/config"
          # One definition of the directory, for the steps that use it.
          echo "TAP_SSH=$TAP_SSH" >> "$GITHUB_ENV"

      - name: Clone the tap over the deploy key
        run: |
          set -euo pipefail
          SSH_COMMAND="ssh -F $(printf '%q' "$TAP_SSH/config")"
          git -c core.sshCommand="$SSH_COMMAND" clone git@github-tap:dibas-np/homebrew-tap.git "$RUNNER_TEMP/tap"
          git -C "$RUNNER_TEMP/tap" config core.sshCommand "$SSH_COMMAND"
          git -C "$RUNNER_TEMP/tap" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rewrite the cask for this release
        env:
          NEPAKIT_TAP_DIR: ${{ runner.temp }}/tap
          VERSION: ${{ needs.preflight.outputs.version }}
        run: ./scripts/update-cask.sh "$VERSION"

      - name: Show what changed
        run: git -C "$RUNNER_TEMP/tap" diff

      - name: Commit and push
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if git -C "$RUNNER_TEMP/tap" diff --quiet HEAD --; then
            echo "nothing to commit; the cask already names this release"
          else
            git -C "$RUNNER_TEMP/tap" commit -am "nepalkit $VERSION"
          fi
          git -C "$RUNNER_TEMP/tap" push origin HEAD:main
