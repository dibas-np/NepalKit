# What a release tag does, and what it cannot do.
#
# Pushing a `v*` tag runs two jobs: the macOS 26 floor gate over the tagged
# commit, and — only if that passed — a bump of the Homebrew cask in
# dibas-np/homebrew-tap.
#
# ## Nothing here can produce a release
#
# NepalKit's releases are cut on one machine, by hand, because the EdDSA private
# key that signs every update lives in that machine's login keychain and the
# Developer ID and notary credentials are local too (ADR-0012). Putting any of
# them in Actions to make this workflow complete would trade the property that
# matters most — that a stolen repository cannot produce a signed NepalKit — for
# a convenience nobody asked for. So this workflow reads the release; it never
# writes one.
#
# The credential it does hold is a **deploy key scoped to write access on
# dibas-np/homebrew-tap alone**. It is not a signing credential, it cannot reach
# this repository, and it exists only because a fresh `brew install` should
# install the release that was just tagged.
#
# ## The ordering is the point
#
# The cask bump needs the floor gate: a cask rewritten to advertise a build that
# does not compile on the deployment floor would send every new Homebrew user
# exactly the app the gate exists to keep off their machine. `needs:` is doing real
# work here, not satisfying a lint.
#
# ## Failing is the correct outcome when the release is not published yet
#
# `update-cask.sh` checksums the DMG from the release page and verifies it with
# `hdiutil`. A tag pushed before its release has the asset attached makes this
# job fail, deliberately: the alternative is a cask pinned to a digest computed
# over GitHub's 404 page. Publish the release with `gh release create v<version>`
# (which pushes the tag and so triggers this workflow) rather than pushing the tag
# first.

name: release tag

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Neither job needs to write to this repository. The tap push is authenticated by
# the deploy key, not by GITHUB_TOKEN, so the default token stays read-only — a
# workflow that can push to the repository it is checking out of is a wider
# credential than the job needs.
permissions:
  contents: read

jobs:
  floor:
    name: gate the tagged commit on macOS 26
    uses: ./.github/workflows/macos26-floor.yml

  bump-tap:
    name: bump the Homebrew cask
    needs: floor
    runs-on: macos-26
    timeout-minutes: 15
    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Leave the default token out of .git/config. This job authenticates
          # to the tap with the deploy key below, and a token left lying in the
          # workspace is one more credential than it needs.
          persist-credentials: false

      - name: Configure the tap deploy key
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # An empty secret must fail here, loudly, rather than producing a
          # checkout that cannot push and a red job three steps later that reads
          # like a cask problem. The failure names the missing secret instead.
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is empty in the release environment"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          cat >> ~/.ssh/config <<'CONFIG'
          Host github-tap
            HostName github.com
            User git
            IdentityFile ~/.ssh/tap_deploy_key
            IdentitiesOnly yes
          CONFIG
          chmod 600 ~/.ssh/config

          # GitHub's host key, fetched rather than pinned. A deploy key on a
          # third-party host is a trust decision with a live expiry, and
          # keyscan's exposure is a connect-time MITM on the same connection that
          # carries the push; the alternative is a hardcoded host key that has to
          # be replaced by hand when GitHub rotates it, which is the failure this
          # is meant to avoid. Public repositories are what this runs against.
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Clone the tap over the deploy key
        run: |
          set -euo pipefail
          git clone git@github-tap:dibas-np/homebrew-tap.git "$RUNNER_TEMP/tap"
          git -C "$RUNNER_TEMP/tap" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rewrite the cask for this release
        env:
          NEPAKIT_TAP_DIR: ${{ runner.temp }}/tap
        run: ./scripts/update-cask.sh "${GITHUB_REF_NAME#v}"

      - name: Show what changed
        run: git -C "$RUNNER_TEMP/tap" diff

      # A no-op bump would mean the tag and the cask already agree, which is
      # only true when this workflow has run twice for one release. Push anyway:
      # the commit is empty and git declines to create it, so the job still ends
      # green rather than failing on a condition that is not a fault.
      - name: Commit and push
        run: |
          set -euo pipefail
          git -C "$RUNNER_TEMP/tap" commit -am "nepalkit ${GITHUB_REF_NAME#v}" || \
            echo "nothing to commit; the cask already names this release"
          git -C "$RUNNER_TEMP/tap" push origin HEAD:main
