# Sparkle is pinned through Xcode, which Dependabot can't read; data-sources.yml checks it instead.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # CodeQL refuses to run when init and analyze are at different versions.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
