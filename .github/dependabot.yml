# Sparkle is pinned through Xcode, which Dependabot can't read; data-sources.yml checks it instead.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    # One PR a month. This also keeps CodeQL's init and analyze at the same version, which it requires.
    groups:
      github-actions:
        patterns:
          - "*"
